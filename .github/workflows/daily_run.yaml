name: Daily tornado alert fetch

on:
  schedule:
    - cron: '0 12 * * *'   # runs at 12:00 UTC daily -- gives the prior day's
                            # datamart retention window time to be fully populated
  workflow_dispatch:       # enables manual runs, with optional override inputs
    inputs:
      start:
        description: 'Start hour (YYYY/MM/DD/HH) -- leave blank for yesterday'
        required: false
      end:
        description: 'End hour (YYYY/MM/DD/HH) -- leave blank for yesterday'
        required: false

jobs:
  fetch-and-track:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests geojson

      - name: Run tracker
        run: |
          if [ -n "${{ github.event.inputs.start }}" ]; then
            python warning_reader.py --start "${{ github.event.inputs.start }}" --end "${{ github.event.inputs.end }}"
          else
            python warning_reader.py
          fi

      - name: Commit updated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add finalAlerts.csv active_alerts.json cap_files/ geojson_files/
          git diff --staged --quiet || git commit -m "Daily alert update: $(date -u +%Y-%m-%d)"
          git push