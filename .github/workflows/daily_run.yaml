name: Daily tornado warning and watch fetch

on:
  schedule:
    - cron: '0 12 * * *'   # runs at 12:00 UTC daily
                           # gives the prior day's datamart retention window
                           # time to be fully populated

  workflow_dispatch:       # enables manual runs, with optional override inputs
    inputs:
      start:
        description: 'Start hour (YYYY/MM/DD/HH) -- leave blank for yesterday'
        required: false
      end:
        description: 'End hour (YYYY/MM/DD/HH) -- leave blank for yesterday'
        required: false

jobs:
  fetch-and-track:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests geojson shapely gspread google-auth

      # -------------------------
      # WARNING READER
      # -------------------------
      - name: Run warning tracker
        env:
          GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: |
          if [ -n "${{ github.event.inputs.start }}" ]; then
           python Warnings/warning_reader.py \
              --start "${{ github.event.inputs.start }}" \
              --end "${{ github.event.inputs.end }}"
          else
            python Warnings/warning_reader.py
          fi

      # -------------------------
      # WATCH READER
      # -------------------------
      - name: Run watch tracker
        env:
          GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
        run: |
          if [ -n "${{ github.event.inputs.start }}" ]; then
            python Watches/watch_reader.py \
              --start "${{ github.event.inputs.start }}" \
              --end "${{ github.event.inputs.end }}"
          else
            python Watches/watch_reader.py
          fi

      # -------------------------
      # LOG SUCCESSFUL RUN
      # -------------------------
      - name: Log successful fetch
        run: |
          mkdir -p Logs
          echo "$(date -u +%Y-%m-%d) fetch successful" >> Logs/fetch_log.txt

      # -------------------------
      # COMMIT EVERYTHING
      # -------------------------
      - name: Commit updated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add \
            Warnings/finalWarnings.csv \
            Warnings/active_warnings.json \
            Warnings/Archived_Files/ \
            Watches/finalWatches.csv \
            Watches/active_watches.json \
            Watches/Archived_Files/
            Logs/fetch_log.txt

          git diff --staged --quiet || git commit -m "Daily warning and watch update: $(date -u +%Y-%m-%d)"

          git push